[build]
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/database/schema.sql"]

[functions."sync-contests"]
  schedule = "0 */2 * * *" # Runs every 2 hours UTC

[functions."daily-digest"]
  schedule = "0 * * * *"   # Runs hourly to evaluate each server's local morning time

[functions."weekly-digest"]
  schedule = "0 * * * *"   # Runs hourly to evaluate each server's local Monday morning time
